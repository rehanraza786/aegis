name: test
# AEGIS self-test suite: both editions × linux + windows.
# Copy .github-workflows/ to .github/workflows/ when pushing to GitHub.
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [node, python]
    runs-on: ${{ matrix.os }}
    # The harness forces UTF-8 on its own streams; this makes every CHILD python
    # process (servers, indexer, probes) do the same, so a tool's em-dash cannot
    # take down a job on the Windows runner's cp1252 codepage.
    # A hung suite used to sit for hours with nothing on screen: python
    # block-buffers when stdout is a pipe, so a deadlock looked identical to a
    # slow job. Unbuffered output shows exactly which check it stopped after,
    # and the timeout turns a hang into a failure someone can act on.
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run suite
        run: python -u tests/run_tests.py --runtime ${{ matrix.runtime }}
